name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -c constraints-build.txt
      - name: Run offline regressions and CLI validation
        run: python scripts/check_release.py
      - name: Build and smoke-test standalone executables
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: VASCULUM-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  minimum-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r herbarium_specimen_collector/requirements.txt
      - run: python scripts/check_release.py
