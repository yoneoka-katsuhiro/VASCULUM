name: Tests

on:
  push:
  pull_request:

jobs:
  collector-offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herbarium_specimen_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run offline tests
        run: python tests/test_offline.py
      - name: Run manual specimen-review tests
        run: python tests/test_manual_review.py
      - name: Run collector-to-curator evidence handoff tests
        run: python tests/test_coordinate_evidence.py

  curator-offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_georeference_curator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
      - name: Install R plotting dependencies
        run: |
          mkdir -p .Rlibrary
          R_LIBS_USER="$PWD/.Rlibrary" Rscript --vanilla -e 'install.packages(c("ggplot2", "ggalluvial"), repos="https://cloud.r-project.org")'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run offline tests
        run: python tests/test_offline.py
      - name: Run token-efficiency regression tests
        run: python tests/test_token_efficiency.py
      - name: Run advisory habitat-review tests
        run: python tests/test_habitat_review.py
      - name: Run coordinate-policy and checkpoint tests
        run: python tests/test_policy.py
      - name: Run photo-first routing regression tests
        run: python tests/test_photo_policy.py
      - name: Run personal input and handoff tests
        run: python tests/test_personal_inputs.py
      - name: Run miss-prefix and final-image tests
        run: python tests/test_manual_review.py
      - name: Run ribbon provenance and R-rendering tests
        run: python tests/test_ribbon.py
      - name: Run automatic acceptance, cache and SIGINT regressions
        run: python tests/test_auto_acceptance.py

  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: find . -path '*/.venv' -prune -o -name '*.sh' -type f -exec bash -n {} +
