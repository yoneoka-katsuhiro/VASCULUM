name: Tests

on:
  push:
  pull_request:

jobs:
  collector-offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herbarium_specimen_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run offline tests
        run: python tests/test_offline.py
      - name: Run manual specimen-review tests
        run: python tests/test_manual_review.py

  curator-offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_georeference_curator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests
      - name: Run offline tests
        run: python tests/test_offline.py
      - name: Run token-efficiency regression tests
        run: python tests/test_token_efficiency.py
      - name: Run advisory habitat-review tests
        run: python tests/test_habitat_review.py
      - name: Run policy, checkpoint and benchmark tests
        run: python tests/test_policy_evaluation.py
      - name: Run personal input and handoff tests
        run: python tests/test_personal_inputs.py
      - name: Run miss-prefix and final-image tests
        run: python tests/test_manual_review.py

  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: find . -path '*/.venv' -prune -o -name '*.sh' -type f -exec bash -n {} +
